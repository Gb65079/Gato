<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório Glitchado</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/laboratorio.css">
    <link rel="stylesheet" href="assets/css/challenges.css">
    <link rel="stylesheet" href="assets/css/encrypted-files.css">
</head>
<body class="laboratorio-world" data-encrypted-file="laboratory">
    <div class="laboratorio-glitch-layer" aria-hidden="true"></div>
    <div class="laboratorio-machines" aria-hidden="true">
        <div class="lab-machine lab-machine-main">
            <div class="lab-machine-screen"></div>
            <img class="lab-code-sprite lab-code-sprite-main" src="assets/sprites/SpriteSheets/code.png" alt="">
            <div class="lab-machine-controls"></div>
        </div>
        <div class="lab-machine lab-machine-side lab-machine-side-left">
            <div class="lab-machine-screen"></div>
            <img class="lab-code-sprite" src="assets/sprites/SpriteSheets/code.png" alt="">
        </div>
        <div class="lab-machine lab-machine-side lab-machine-side-right">
            <div class="lab-machine-screen"></div>
            <img class="lab-code-sprite" src="assets/sprites/SpriteSheets/code.png" alt="">
        </div>
        <div class="lab-cable lab-cable-one"></div>
        <div class="lab-cable lab-cable-two"></div>
    </div>

    <div class="dialog-box closed">
        <img src="" alt="" srcset="">
        <div class="dialog">
            <h1 id="dialog-character-name"></h1>
            <p id="dialog-content"></p>
        </div>
    </div>

    <script src="assets/sprites/Sprite.js"></script>
    <script src="assets/sprites/Framer.js"></script>
    <script src="assets/scripts/SceneManager.js"></script>
    <script src="assets/scripts/Main.js"></script>
    <script src="assets/scripts/TeleportPoints.js"></script>
    <script src="assets/scripts/EncryptedFiles.js"></script>
    <script src="assets/scenes/Laboratorio.js"></script>
    <script src="assets/scripts/Challenges.js"></script>
</body>
</html>
