<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Formatador JS com Detalhe de Erros</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        h3 {
            margin-top: 0;
            color: #9cdcfe;
        }
        .editor-container {
            position: relative;
            flex: 1;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        textarea, pre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: none;
            background: transparent;
        }
        textarea {
            color: transparent;
            caret-color: #d4d4d4;
            resize: none;
            outline: none;
            z-index: 2;
        }
        pre {
            color: #d4d4d4;
            pointer-events: none;
            z-index: 1;
            overflow: auto;
        }
        code {
            font-family: 'Courier New', Courier, monospace;
        }

        /* Cores de Sintaxe (Tema VS Code Dark+) */
        .token-keyword { color: #c586c0; font-weight: bold; }
        .token-string { color: #ce9178; }
        .token-number { color: #b5cea8; }
        .token-comment { color: #6a9955; font-style: italic; }
        .token-function { color: #dcdcaa; }
        
        /* Sublinhado de erro ativo apenas quando necessário */
        .has-syntax-error {
            text-decoration: underline wavy #f44336;
        }

        #error-log {
            margin-top: 10px;
            padding: 8px;
            background-color: #2d2d2d;
            border-left: 4px solid #4CAF50;
            color: #4CAF50;
            font-family: monospace;
            font-size: 12px;
            min-height: 20px;
            max-height: 60px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="pane">
        <h3>Editor de Código JS</h3>
        <div class="editor-container">
            <textarea id="code-input" placeholder="// Escreva o seu código JavaScript aqui..."></textarea>
            <pre><code id="code-output"></code></pre>
        </div>
        <div id="error-log">Nenhum erro de sintaxe detetado.</div>
    </div>

    <script>
        const input = document.getElementById('code-input');
        const output = document.getElementById('code-output');
        const errorLog = document.getElementById('error-log');

        const keywords = /\b(const|let|var|function|return|if|else|for|while|class|constructor|this|new|import|export|default|async|await|true|false|null|undefined)\b/g;
        const numbers = /\b(\d+)\b/g;
        const strings = /('[^']*'|"[^"]*"|`[^`]*`)/g;
        const comments = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g;
        const functions = /\b([a-zA-Z_$][a-zA-Z0-9_$]*)(?=\s*\()/g;

        function escapeHTML(text) {
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;");
        }

        function highlightSyntax(code) {
            let safeCode = escapeHTML(code);

            safeCode = safeCode.replace(comments, '<span class="token-comment">$1</span>');
            safeCode = safeCode.replace(strings, '<span class="token-string">$1</span>');
            safeCode = safeCode.replace(keywords, '<span class="token-keyword">$1</span>');
            safeCode = safeCode.replace(numbers, '<span class="token-number">$1</span>');
            safeCode = safeCode.replace(functions, '<span class="token-function">$1</span>');

            return safeCode;
        }

        function checkSyntax(code) {
            // Insere sempre o código formatado de forma limpa
            output.innerHTML = highlightSyntax(code);

            try {
                if (code.trim() !== "") {
                    new Function(code);
                }
                // Sintaxe Correta: Remove a classe de erro do elemento visual e atualiza a mensagem verde
                output.classList.remove('has-syntax-error');
                errorLog.style.borderLeftColor = '#4CAF50';
                errorLog.style.color = '#4CAF50';
                errorLog.textContent = 'Sintaxe válida.';
            } catch (error) {
                // Sintaxe Incorreta: Adiciona o sublinhado ondulado vermelho e mostra a mensagem de erro
                output.classList.add('has-syntax-error');
                errorLog.style.borderLeftColor = '#f44336';
                errorLog.style.color = '#f44336';
                errorLog.textContent = `Erro de Sintaxe: ${error.message}`;
            }
        }

        input.addEventListener('input', () => {
            checkSyntax(input.value);
        });

        input.addEventListener('scroll', () => {
            output.scrollTop = input.scrollTop;
            output.scrollLeft = input.scrollLeft;
        });
    </script>
</body>
</html>
